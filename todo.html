<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>할 일 나침반</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 수첩 한 쪽 같은 좁은 한 줄 칼럼. 날짜·통계 → 급한 일 → 지금 할 일(형광펜 카드) → 추가 → 할 일 트리 */
:root {
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --sunk: #E2E7EE;
  --ink: #18202D;
  --muted: #566073;
  --line: #D2D9E3;
  --accent: #2B55C9;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE5FB;
  --mark: #FFE16B;
  --danger: #B5302A;
  --danger-soft: #FBE3E0;
  --warn: #965800;
  --warn-soft: #FBEED3;
  --ok: #2B7A4B;
  --f-display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F141C; --surface: #171E2A; --sunk: #202937; --ink: #E6EBF3; --muted: #9DA8BA;
    --line: #2B3546; --accent: #88A7FF; --accent-ink: #0B1222; --accent-soft: #1F2B4A;
    --mark: #6E5C14; --danger: #FF8C82; --danger-soft: #3B1E1D; --warn: #F2B65C;
    --warn-soft: #362913; --ok: #76CF99;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141C; --surface: #171E2A; --sunk: #202937; --ink: #E6EBF3; --muted: #9DA8BA;
  --line: #2B3546; --accent: #88A7FF; --accent-ink: #0B1222; --accent-soft: #1F2B4A;
  --mark: #6E5C14; --danger: #FF8C82; --danger-soft: #3B1E1D; --warn: #F2B65C;
  --warn-soft: #362913; --ok: #76CF99;
  color-scheme: dark;
}

[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 112px;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.wrap { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 머리말 */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.eyebrow { margin: 0; font-size: 13px; color: var(--muted); letter-spacing: .02em; }
h1 { margin: 2px 0 0; font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1.15; text-wrap: balance; }
.stats { display: flex; gap: 6px; margin: 0; }
.stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 62px; }
.stats dt { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.stats dd { margin: 0; font-family: var(--f-mono); font-size: 20px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.stats .is-over dd { color: var(--danger); }

.label { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.crumb { margin: 0 0 1px; font-size: 12px; color: var(--muted); line-height: 1.45; }

/* 급한 일 */
.alerts { display: grid; gap: 8px; }
.alert { border-radius: 12px; padding: 12px 14px; }
.alert h3 { margin: 0 0 4px; font-size: 14px; }
.alert ul { margin: 0; padding-left: 18px; }
.alert li { margin: 2px 0; }
.alert.danger { background: var(--danger-soft); }
.alert.danger h3 { color: var(--danger); }
.alert.warn { background: var(--warn-soft); }
.alert.warn h3 { color: var(--warn); }
.alert.calm { background: var(--surface); border: 1px dashed var(--line); color: var(--muted); }
.alert.calm p { margin: 0; }
.alert-sub, .alert-more, .alert-crumb { color: var(--muted); }

/* 지금 할 일 */
.now { background: var(--surface); border: 2px solid var(--ink); border-radius: 14px; padding: 16px 18px 18px; }
.now .crumb { margin-top: 2px; font-size: 13px; }
.now-title { margin: 2px 0 10px; font-size: 22px; font-weight: 700; line-height: 1.5; }
.now-title mark {
  color: inherit;
  background: linear-gradient(transparent 55%, var(--mark) 55%, var(--mark) 94%, transparent 94%);
  padding: 0 3px;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
.now-meta, .row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.now-meta { margin: 0 0 14px; }
.now-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.tip, .now-empty { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
.clock-line { margin: 12px 0 0; display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-size: 14px; }
.clock { font-family: var(--f-mono); font-size: 30px; color: var(--ink); font-variant-numeric: tabular-nums; }
.next { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.next b { color: var(--ink); font-weight: 500; }

.pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; padding: 1px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.soon { background: var(--accent-soft); color: var(--accent); }
.pri, .date { font-size: 12px; color: var(--muted); white-space: nowrap; }
.pri.p1 { color: var(--danger); font-weight: 700; }

.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: var(--r); padding: 10px 16px; font-weight: 700; }
.primary.small { padding: 7px 14px; font-size: 14px; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: var(--r); padding: 9px 14px; }
.ghost:hover { border-color: var(--muted); }
.ghost.small { padding: 6px 11px; font-size: 13px; }

/* 추가 */
.add form { display: flex; flex-direction: column; gap: 14px; }
#title, #parent-select {
  width: 100%; box-sizing: border-box; font: inherit; font-size: 16px;
  padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--r);
  background: var(--surface); color: var(--ink);
}
#title::placeholder { color: var(--muted); }
.field { display: grid; gap: 6px; }
.field-label { font-size: 13px; color: var(--muted); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 14px; }
.chip.small { padding: 4px 11px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.date-chip { display: inline-flex; align-items: center; gap: 4px; border: 1px dashed var(--line); border-radius: 999px; padding: 1px 6px 1px 13px; font-size: 14px; color: var(--muted); background: var(--surface); }
.date-chip.is-on { border-style: solid; border-color: var(--ink); color: var(--ink); }
.date-chip input { font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--ink); padding: 3px 4px; min-width: 0; max-width: 150px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.form-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.due-preview, .form-msg { margin: 0; font-size: 13px; color: var(--muted); }
.form-msg:empty { display: none; }

/* 할 일 트리 */
.list-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.list-head .label { margin: 0; }
.list-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.link-btn { border: 0; background: transparent; color: var(--accent); font-size: 13px; padding: 6px 2px; }
.tabs { display: flex; gap: 3px; background: var(--sunk); padding: 3px; border-radius: 10px; }
.tab { border: 0; background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 0 0 1px var(--line); }
.count { font-family: var(--f-mono); font-variant-numeric: tabular-nums; margin-left: 2px; }

.tree { list-style: none; margin: 0; padding: 2px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.tree > .node + .node { border-top: 1px solid var(--line); }
.branch { list-style: none; margin: 0 0 6px 18px; padding: 0; border-left: 1px solid var(--line); }
.row { display: flex; align-items: flex-start; gap: 4px; padding: 9px 8px 9px 6px; }
.branch .row { padding-block: 5px; }
.twisty, .twisty-space { flex: none; width: 24px; height: 28px; }
.twisty { border: 0; background: transparent; padding: 0; display: grid; place-items: center; border-radius: 6px; color: var(--muted); }
.twisty:hover { background: var(--sunk); color: var(--ink); }
.chev { width: 0; height: 0; border-left: 6px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.twisty[aria-expanded="true"] .chev { transform: rotate(90deg); }
.check { flex: none; width: 32px; height: 28px; border: 0; background: transparent; padding: 0; display: grid; place-items: center; border-radius: 8px; }
.ring { width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; }
.check:hover .ring { border-color: var(--ok); }
.check[aria-pressed="true"] .ring { background: var(--ok); border-color: var(--ok); }
.check[aria-pressed="true"] .ring::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--surface); border-bottom: 2px solid var(--surface); transform: translateY(-1px) rotate(-45deg); }
.row-main { flex: 1; min-width: 0; padding-top: 2px; }
.row-title { margin: 0; line-height: 1.5; }
.row-meta { margin: 3px 0 0; }
.more { flex: none; width: 32px; height: 28px; border: 0; background: transparent; border-radius: 8px; color: var(--muted); font-size: 18px; line-height: 1; padding: 0; }
.more:hover, .more[aria-expanded="true"] { background: var(--sunk); color: var(--ink); }
.restore { flex: none; }
.node.is-done > .row .row-title { text-decoration: line-through; color: var(--muted); }
.node.is-closed > .row { opacity: .55; }
.flat .row { padding: 10px 10px 10px 6px; }
.progress { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { width: 44px; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.fill { display: block; height: 100%; background: var(--ok); }
.link-add { border: 0; background: transparent; padding: 0 2px; color: var(--accent); font-size: 12px; font-weight: 500; }
.ghost-add { margin: 0 0 2px 6px; padding: 5px 8px; border: 0; background: transparent; color: var(--accent); font-size: 13px; border-radius: 8px; }
.ghost-add:hover { background: var(--accent-soft); }

.panel { margin: 2px 8px 10px; padding: 12px; background: var(--sunk); border-radius: 12px; display: grid; gap: 8px; }
.branch .panel { margin-left: 6px; }
.panel.menu { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; }
.panel.menu .ghost { background: var(--surface); }
.panel input[type="text"], .panel select {
  width: 100%; box-sizing: border-box; font: inherit; font-size: 16px;
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink);
}
.panel-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.panel-actions .ghost { background: var(--surface); }
.panel-msg { margin: 0; font-size: 13px; color: var(--muted); }
.panel-msg:empty { display: none; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 18px; color: var(--muted); display: grid; gap: 10px; justify-items: start; }
.empty p { margin: 0; }
.fine { font-size: 13px; }

.foot { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.foot p { margin: 0; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: max-content;
  max-width: min(520px, calc(100% - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  box-sizing: border-box; display: flex; align-items: center; gap: 12px;
  background: var(--ink); color: var(--bg); padding: 10px 12px 10px 16px; border-radius: 12px; font-size: 14px;
}
.toast span { min-width: 0; }
.toast button { flex: none; background: transparent; border: 1px solid currentColor; border-radius: 8px; padding: 4px 10px; white-space: nowrap; }

@media (prefers-reduced-motion: no-preference) {
  .chip, .tab, .ghost, .ring, .more, .twisty { transition: background-color .15s, border-color .15s, color .15s; }
  .chev { transition: transform .15s; }
}
</style>

<main class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="today-label">오늘</p>
      <h1>할 일 나침반</h1>
    </div>
    <dl class="stats">
      <div><dt>오늘 끝냄</dt><dd id="st-done">–</dd></div>
      <div><dt>남은 일</dt><dd id="st-left">–</dd></div>
      <div id="st-over-box"><dt>날짜 지남</dt><dd id="st-over">–</dd></div>
    </dl>
  </header>

  <section class="alerts" id="alerts" aria-label="급한 일" hidden></section>

  <section class="now" aria-labelledby="now-h">
    <h2 id="now-h" class="label">지금 할 일</h2>
    <div id="now-body"><p class="now-empty">할 일을 불러오는 중이에요…</p></div>
  </section>

  <section class="add" aria-labelledby="add-h">
    <h2 id="add-h" class="label">할 일 추가</h2>
    <form id="add-form" autocomplete="off" novalidate>
      <label for="title" class="sr">할 일</label>
      <input id="title" name="title" type="text" maxlength="120" enterkeyhint="done" placeholder="예: 이사 준비, 보고서 쓰기">
      <div class="field">
        <label for="parent-select" class="field-label">넣을 곳</label>
        <select id="parent-select" name="parent-select">
          <option value="">맨 위 (새 큰 테마나 할 일)</option>
        </select>
      </div>
      <fieldset id="due-chips">
        <legend>시행일</legend>
        <div class="chip-row">
          <button type="button" class="chip" data-due="today">오늘</button>
          <button type="button" class="chip" data-due="tomorrow">내일</button>
          <button type="button" class="chip" data-due="weekend">이번 주말</button>
          <button type="button" class="chip" data-due="none">없음</button>
          <label class="date-chip" id="date-chip" for="due-date">날짜 고르기
            <input type="date" id="due-date" name="due-date">
          </label>
        </div>
      </fieldset>
      <fieldset id="pri-chips">
        <legend>중요도</legend>
        <div class="chip-row">
          <button type="button" class="chip" data-pri="1">높음</button>
          <button type="button" class="chip" data-pri="2">보통</button>
          <button type="button" class="chip" data-pri="3">낮음</button>
        </div>
      </fieldset>
      <p class="hint" id="parent-hint" hidden></p>
      <div class="form-foot">
        <button type="submit" class="primary" id="add-btn">추가하기</button>
        <p class="due-preview" id="due-preview">시행일: 정하지 않음</p>
      </div>
      <p class="form-msg" id="form-msg" role="status"></p>
    </form>
  </section>

  <section class="list" aria-labelledby="list-h">
    <div class="list-head">
      <h2 id="list-h" class="label">할 일 트리</h2>
      <div class="list-tools">
        <button type="button" class="link-btn" id="fold-all" hidden>모두 접기</button>
        <div class="tabs" role="tablist" aria-label="목록 보기">
          <button type="button" role="tab" class="tab" data-tab="todo" id="tab-todo">진행 중</button>
          <button type="button" role="tab" class="tab" data-tab="done" id="tab-done">완료 <span class="count" id="c-done"></span></button>
          <button type="button" role="tab" class="tab" data-tab="archived" id="tab-archived">보관함 <span class="count" id="c-archived"></span></button>
        </div>
      </div>
    </div>
    <div role="tabpanel" aria-labelledby="list-h" id="tree-area">
      <div class="empty"><p>불러오는 중이에요…</p></div>
    </div>
  </section>

  <footer class="foot">
    <p id="save-note">저장 위치를 확인하는 중이에요…</p>
    <p>큰 테마 아래에 세부 할 일을 넣으려면 항목의 '+ 세부'나 ⋯ 메뉴를 누르세요. 위 칸의 '넣을 곳'에서 골라도 돼요.</p>
    <p>할 일은 지워지지 않아요. '보관'하면 보관함으로 옮겨지고, 언제든 되돌릴 수 있어요.</p>
  </footer>
</main>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  'use strict';
  const LS_TASKS = 'todo-compass.tasks.v1';
  const LS_TAB = 'todo-compass.tab';
  const LS_COLLAPSED = 'todo-compass.collapsed';
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const PRI = { 1: '높음', 2: '보통', 3: '낮음' };
  const FIVE_MIN = 5 * 60 * 1000;
  const MAX_DEPTH = 3; /* 맨 위(0)부터 4단계까지 */

  const state = {
    tasks: [], ready: false, tab: 'todo',
    due: null, dueKind: 'none', pri: 2, parent: '',
    panel: null, collapsed: new Set(), day: '',
  };
  let IX = emptyIndex();
  let store = null;
  let parentSig = null;
  let composing = false;
  let pendingRender = false;
  const chains = new Map();
  const timer = { handle: null, taskId: null, endAt: 0, finishedFor: null };

  const $ = (s) => document.querySelector(s);
  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid != null) n.append(kid);
    return n;
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const short = (s, n = 18) => (s.length > n ? s.slice(0, n) + '…' : s);
  const focusId = (id) => setTimeout(() => { const n = document.getElementById(id); if (n) n.focus(); }, 0);

  /* ---------- 날짜 ---------- */
  function iso(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  const todayISO = () => iso(new Date());
  function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); }
  function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  const validISO = (v) => (/^\d{4}-\d{2}-\d{2}$/.test(v || '') ? v : null);
  function localDay(ts) {
    if (!ts) return null;
    const d = new Date(ts);
    return isNaN(d) ? null : iso(d);
  }
  function daysUntil(due) {
    if (!due) return null;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((parseISO(due) - today) / 86400000);
  }
  function fmtDate(s) { const d = parseISO(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; }
  function whenLabel(n) {
    if (n === null) return '시행일 없음';
    if (n < 0) return `${-n}일 지남`;
    if (n === 0) return '오늘';
    if (n === 1) return '내일';
    return `${n}일 뒤`;
  }
  function whenTone(n) {
    if (n === null) return '';
    if (n < 0) return 'danger';
    if (n === 0) return 'warn';

  }

  /* ---------- 트리 구조 ---------- */
  function emptyIndex() { return { byId: new Map(), kids: new Map(), roots: [], parent: new Map() }; }
  function buildIndex(tasks) {
    const byId = new Map(tasks.map((t) => [t.id, t]));
    const kids = new Map();
    const roots = [];
    const pid = (t) => (t.parentId && t.parentId !== t.id && byId.has(t.parentId) ? t.parentId : null);
    for (const t of tasks) {
      const p = pid(t);
      if (!p) { roots.push(t); continue; }
      if (!kids.has(p)) kids.set(p, []);
      kids.get(p).push(t);
    }
    /* 서로를 가리키는 고리가 생겨도 항목이 사라지지 않도록 맨 위로 꺼냅니다 */
    const seen = new Set();
    const walk = (t) => {
      if (seen.has(t.id)) return;
      seen.add(t.id);
      (kids.get(t.id) || []).forEach(walk);
    };
    roots.forEach(walk);
    for (const t of tasks) {
      if (seen.has(t.id)) continue;
      const p = pid(t);

      roots.push(t);

  function byUrgency(a, b) {

  const optionLabel = (t, depth) => '   '.repeat(depth) + (depth ? '└ ' : '') + short(t.title, 28);
  /* 옮겨 갈 수 있는 상위 항목 목록 (자기 자신·하위 항목 제외, 4단계를 넘지 않게) */

  /* ---------- 데이터 ---------- */

  const newId = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function setTasks(list) { state.tasks = list; IX = buildIndex(list); }
  function upsert(t) {

  function saveError(e) {

    if (code === 'quota_exceeded') return '저장 공간이 가득 차서 저장하지 못했어요.';
    if (code === 'local_failed') return '이 브라우저에 저장하지 못했어요. 사생활 보호 모드를 끄고 다시 시도해 주세요.';

  /* 같은 항목의 저장은 한 번에 하나씩 차례로 */

  /* 바뀐 칸만 합쳐서 저장하므로 기존에 있던 다른 칸은 그대로 남습니다 */
  function commitPatch(t, fields) {
    const cur = state.tasks.find((x) => x.id === t.id) || t;

    requestRender();
    queue(t.id, () => store.patch(t.id, fields));
  }

  /* ---------- 저장소 연결 ---------- */
  const setNote = (s) => { $('#save-note').textContent = s; };
  async function retryOnce(fn) {
    try { return await fn(); }
    catch (e) {
      if (!e || e.code !== 'unavailable') throw e;
      await wait(600 + Math.random() * 900);
      return fn();
    }
  }
  function useLocal(note) {
    let text = null;
    try { text = localStorage.getItem(LS_TASKS); } catch (_) {}
    let raw = [];
    if (text) {
      let parsed = null;
      try { parsed = JSON.parse(text); } catch (_) {}
      if (Array.isArray(parsed)) raw = parsed;
      else {
        /* 읽을 수 없는 기록은 덮어쓰지 않고 따로 옮겨 둡니다 */
        try { localStorage.setItem(`${LS_TASKS}.broken-${Date.now()}`, text); } catch (_) {}
      }
    }
    raw = raw.filter((x) => x && typeof x === 'object' && x.id != null);
    const persist = () => {
      try { localStorage.setItem(LS_TASKS, JSON.stringify(raw)); }
      catch (_) { throw { code: 'local_failed' }; }
    };
    store = {
      async create(t) { raw.push({ ...t }); persist(); },
      async patch(id, fields) {
        const r = raw.find((x) => String(x.id) === id);
        if (r) Object.assign(r, fields);

  }
  async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') {
      useLocal('이 브라우저에만 저장돼요. 다른 기기에서는 보이지 않아요.');
      return;
    }
    const slow = setTimeout(() => {
      if (!state.ready) setNote('저장소에 연결하는 데 시간이 걸리고 있어요. 인터넷 연결을 확인해 주세요.');
    }, 10000);
    let db = null, user = null;

    const uid = user ? await user.id() : null;
    if (!db || !uid) {
      clearTimeout(slow);
      useLocal('로그인 정보를 받지 못해 이 브라우저에만 저장돼요. 다른 기기에서는 보이지 않아요.');
      return;
    }
    const col = db.collection('data/users/' + uid);
    store = {
      create: (t) => retryOnce(() => col.doc(t.id).set(t)),
      patch: (id, fields) => retryOnce(() => col.doc(id).update(fields)),
    };
    col.onSnapshot((snap) => {
      if (!snap.metadata.fromCache) clearTimeout(slow);

      state.ready = true;
      setNote('내 계정에 저장돼요. 나만 볼 수 있고, 휴대폰과 컴퓨터 어디서 열어도 같은 목록이 보여요.');

    }, () => {
      clearTimeout(slow);
      state.ready = true;

    });
  }

  /* ---------- 동작 ---------- */
  function addTask({ title, due = null, priority = 2, parentId = null }) {
    const t = normalize(newId(), { title, due, priority, parentId, created: new Date().toISOString() });
    commitCreate(t);
    return t;
  }
  function setDone(t, done) {
    const id = t.id;

    if (!done) { toast(`'${short(t.title)}' 완료를 취소했어요.`); return; }

    let msg = `'${short(t.title)}' 완료!`;
    if (openKids) msg += ` 남은 세부 할 일 ${openKids}개도 함께 닫혔어요.`;
    const parent = parentOf(IX.byId.get(id) || t);
    if (parent && !parent.done && liveKids(parent).every((c) => c.done)) {
      const pid = parent.id;
      toast(`${msg} '${short(parent.title)}'의 세부 할 일을 다 끝냈어요.`, {
        label: '상위 항목도 완료',
        run: () => { const p = IX.byId.get(pid); if (p && !p.done) setDone(p, true); },
      }, 9000);
      return;
    }
    const left = state.tasks.filter(isActionable).length;
    toast(`${msg} 남은 일 ${left}개.`, {
      label: '되돌리기',

  }

        : `'${short(t.title)}' 보관함으로 옮겼어요.`, {

  function addExamples() {

    addTask({ title: '(예시) 짐 싸기', due: addDays(2), parentId: theme.id });

    addTask({ title: '(예시) 운동 30분', priority: 3 });

  }

  /* 트리 안 펼침 메뉴·입력 칸 */
  const isPanel = (type, id) => !!state.panel && state.panel.type === type && state.panel.id === id;

  }
  function openAdd(t) {

    focusId('panel-title');
  }
  function saveEdit(t) {

  /* ---------- 5분 타이머 ---------- */
  const mmss = (ms) => {

  /* ---------- 화면 ---------- */

  }

  function renderHeader() {
    const now = new Date();

    const over = act.filter((t) => { const n = daysUntil(effDue(t).due); return n !== null && n < 0; }).length;

  }

  function alertBlock(tone, heading, list) {
    const ul = el('ul');
    list.slice(0, 3).forEach((t) => {
      const crumb = crumbText(t);
      const n = daysUntil(effDue(t).due);
      ul.append(el('li', null,
        crumb ? el('span', { class: 'alert-crumb', text: `${crumb} › ` }) : null,
        el('span', { text: t.title }),

    });

  }
  function renderAlerts() {

    if (!state.ready || !act.length) { box.hidden = true; return; }
    const over = act.filter((t) => { const n = daysUntil(effDue(t).due); return n !== null && n < 0; });
    const today = act.filter((t) => daysUntil(effDue(t).due) === 0);
    if (over.length) box.append(alertBlock('danger', `시행일이 지난 일 ${over.length}개`, over));

  function renderNow() {
    const body = $('#now-body');

    if (!state.ready) {
      body.append(el('p', { class: 'now-empty', text: '할 일을 불러오는 중이에요…' }));

    }
    const act = state.tasks.filter(isActionable).sort(byUrgency);
    if (timer.taskId && !act.some((t) => t.id === timer.taskId)) stopTimer();
    if (!act.length) {
      body.append(
        el('p', { class: 'now-title', text: state.tasks.length ? '남은 할 일이 없어요. 잘했어요!' : '아직 적어 둔 할 일이 없어요.' }),
        el('p', { class: 'tip', text: '아래 칸에 할 일을 적으면 무엇부터 할지 여기에서 골라 드려요.' }));

    }
    const focus = (timer.taskId && act.find((t) => t.id === timer.taskId)) || act[0];
    const running = !!timer.handle && timer.taskId === focus.id;
    const eff = effDue(focus);
    const n = daysUntil(eff.due);
    const crumb = crumbText(focus);
    if (crumb) body.append(el('p', { class: 'crumb', text: `${crumb} ›` }));
    body.append(
      el('p', { class: 'now-title' }, el('mark', { text: focus.title })),
      el('p', { class: 'now-meta' },
        el('span', { class: `pill ${whenTone(n)}`, text: whenLabel(n) }),
        eff.due ? el('span', { class: 'date', text: fmtDate(eff.due) + (eff.inherited ? ' · 상위 항목 날짜' : '') }) : null,
        el('span', { class: `pri p${rootOf(focus).priority}`, text: `중요도 ${PRI[rootOf(focus).priority]}` })));
    const actions = el('div', { class: 'now-actions' });
    if (running) {
      actions.append(el('button', { type: 'button', class: 'ghost', id: 'now-stop', text: '타이머 멈추기', onclick: () => { stopTimer(); renderNow(); } }));
    } else {
      actions.append(el('button', {
        type: 'button', class: 'primary', id: 'now-start',
        text: timer.finishedFor === focus.id ? '5분 더 하기' : '5분만 시작하기',
        onclick: () => startTimer(focus.id),
      }));
    }
    actions.append(el('button', { type: 'button', class: 'ghost', id: 'now-done', text: '끝냈어요', onclick: () => setDone(focus, true) }));
    body.append(actions);
    if (running) {
      body.append(el('p', { class: 'clock-line' },
        el('span', { text: '남은 시간' }),
        el('span', { class: 'clock', id: 'timer-clock', text: mmss(timer.endAt - Date.now()) })));
    } else if (timer.finishedFor === focus.id) {
      body.append(el('p', { class: 'tip', text: '5분 해냈어요! 이어서 해도 되고, 여기서 멈춰도 괜찮아요.' }));
    } else {
      body.append(el('p', { class: 'tip', text: '시작이 제일 어려워요. 딱 5분만 해 보세요.' }));
    }
    const next = act.find((t) => t.id !== focus.id);
    if (next) {
      const nc = crumbText(next);
      body.append(el('p', { class: 'next' }, '그다음: ',
        nc ? el('span', { text: `${nc} › ` }) : null,
        el('b', { text: next.title }),
        ` · ${whenLabel(daysUntil(effDue(next).due))}`));
    }
  }

  function renderParentSelect() {
    const opts = parentOptions(null);
    const sig = opts.map((o) => `${o.t.id}:${o.depth}:${o.t.title}`).join('|');
    if (sig !== parentSig) {
      parentSig = sig;
      const sel = $('#parent-select');
      sel.replaceChildren(
        el('option', { value: '', text: '맨 위 (새 큰 테마나 할 일)' }),
        ...opts.map(({ t, depth }) => el('option', { value: t.id, text: optionLabel(t, depth) })));
      if (!opts.some((o) => o.t.id === state.parent)) state.parent = '';
      sel.value = state.parent;
    }
    paintForm();
  }

  /* 트리 한 줄 */
  function checkEl(t, prefix) {
    return el('button', {
      type: 'button', class: 'check', id: `${prefix}-${t.id}`, 'aria-pressed': String(t.done),
      'aria-label': t.done ? `'${t.title}' 완료 취소` : `'${t.title}' 완료로 표시`,
      onclick: () => setDone(t, !t.done),
    }, el('span', { class: 'ring', 'aria-hidden': 'true' }));
  }
  function treeMeta(t, depth, kids) {
    const meta = el('p', { class: 'row-meta' });
    if (t.due) {
      const n = daysUntil(t.due);
      if (!t.done) meta.append(el('span', { class: `pill ${whenTone(n)}`, text: whenLabel(n) }));
      meta.append(el('span', { class: 'date', text: fmtDate(t.due) }));
    }
    if (kids.length) {
      const done = kids.filter((c) => c.done).length;
      const fill = el('span', { class: 'fill' });
      fill.style.width = `${Math.round((done / kids.length) * 100)}%`;
      meta.append(el('span', { class: 'progress', title: `세부 할 일 ${kids.length}개 중 ${done}개 완료` },
        el('span', { class: 'bar', 'aria-hidden': 'true' }, fill), `${done}/${kids.length}`));
    }
    if (depth === 0) meta.append(el('span', { class: `pri p${t.priority}`, text: `중요도 ${PRI[t.priority]}` }));
    if (depth === 0 && !kids.length && !t.done) {
      meta.append(el('button', { type: 'button', class: 'link-add', id: `la-${t.id}`, 'aria-label': `'${t.title}' 아래에 세부 할 일 추가`, text: '+ 세부', onclick: () => openAdd(t) }));
    }
    return meta.childNodes.length ? meta : null;
  }
  function dateField(d, prefix) {
    const row = el('div', { class: 'chip-row' });
    const picks = [['today', '오늘', todayISO()], ['tomorrow', '내일', addDays(1)], ['none', '없음', null]];
    for (const [k, label, value] of picks) {
      const pressed = value === null ? !d.due : d.due === value;
      row.append(el('button', {
        type: 'button', class: 'chip small', id: `${prefix}-${k}`, 'aria-pressed': String(pressed), text: label,
        onclick: () => { d.due = value; requestRender(); },
      }));
    }
    const custom = !!d.due && d.due !== todayISO() && d.due !== addDays(1);
    row.append(el('label', { class: 'date-chip' + (custom ? ' is-on' : ''), for: `${prefix}-date` }, '날짜',
      el('input', { type: 'date', id: `${prefix}-date`, value: d.due || '', onchange: (e) => { d.due = validISO(e.target.value); requestRender(); } })));
    return row;
  }
  function priChips(d) {
    const row = el('div', { class: 'chip-row' });
    for (const n of [1, 2, 3]) {
      row.append(el('button', {
        type: 'button', class: 'chip small', id: `pe-p${n}`, 'aria-pressed': String(d.pri === n), text: PRI[n],
        onclick: () => { d.pri = n; requestRender(); },
      }));
    }
    return row;
  }
  function menuPanel(t, depth) {
    const canAdd = depth < MAX_DEPTH && !t.done;
    return el('div', { class: 'panel menu' },
      canAdd ? el('button', { type: 'button', class: 'ghost small', id: `pm-add-${t.id}`, text: '+ 세부 할 일 추가', onclick: () => openAdd(t) }) : null,
      el('button', { type: 'button', class: 'ghost small', id: `pm-edit-${t.id}`, text: '수정·옮기기', onclick: () => openEdit(t) }),
      el('button', { type: 'button', class: 'ghost small', id: `pm-arch-${t.id}`, text: '보관', onclick: () => setArchived(t, true) }));
  }
  function addPanel(p) {
    const d = state.panel.draft;
    return el('form', { class: 'panel', novalidate: 'novalidate', onsubmit: (e) => { e.preventDefault(); submitChild(p); } },
      el('label', { class: 'field-label', for: 'panel-title', text: `'${short(p.title, 24)}' 아래에 넣을 세부 할 일` }),
      el('input', {
        type: 'text', id: 'panel-title', maxlength: '120', enterkeyhint: 'done', placeholder: '예: 서류 챙기기',
        value: d.title || '', oninput: (e) => { d.title = e.target.value; },
      }),
      el('span', { class: 'field-label', text: '시행일' }),
      dateField(d, 'pa'),
      el('p', { class: 'panel-msg', role: 'status', text: d.msg || '' }),
      el('div', { class: 'panel-actions' },
        el('button', { type: 'submit', class: 'primary small', id: 'pa-submit', text: '추가' }),
        el('button', { type: 'button', class: 'ghost small', id: 'pa-close', text: '닫기', onclick: closePanel })));
  }
  function editPanel(t) {
    const d = state.panel.draft;
    const opts = parentOptions(t.id);
    const sel = el('select', { id: 'pe-parent', onchange: (e) => { d.parent = e.target.value; requestRender(); } },
      el('option', { value: '', text: '맨 위 (큰 테마)' }),
      ...opts.map(({ t: o, depth }) => el('option', { value: o.id, text: optionLabel(o, depth) })));
    if (d.parent && !opts.some((o) => o.t.id === d.parent)) {
      const cur = IX.byId.get(d.parent);
      if (cur) sel.append(el('option', { value: cur.id, text: short(cur.title, 28) }));
    }
    sel.value = d.parent || '';
    const rootAfter = !d.parent;
    return el('form', { class: 'panel', novalidate: 'novalidate', onsubmit: (e) => { e.preventDefault(); saveEdit(t); } },
      el('label', { class: 'field-label', for: 'panel-title', text: '제목' }),
      el('input', { type: 'text', id: 'panel-title', maxlength: '120', value: d.title || '', oninput: (e) => { d.title = e.target.value; } }),
      el('span', { class: 'field-label', text: '시행일' }),
      dateField(d, 'pe'),
      el('label', { class: 'field-label', for: 'pe-parent', text: '위치 (어느 항목 아래에 둘지)' }),
      sel,
      rootAfter ? el('span', { class: 'field-label', text: '중요도' }) : null,
      rootAfter ? priChips(d) : null,
      el('p', { class: 'panel-msg', role: 'status', text: d.msg || '' }),
      el('div', { class: 'panel-actions' },
        el('button', { type: 'submit', class: 'primary small', id: 'pe-save', text: '저장' }),
        el('button', { type: 'button', class: 'ghost small', id: 'pe-cancel', text: '취소', onclick: closePanel })));
  }
  function nodeEl(t, depth) {
    const kids = liveKids(t).sort(byUrgency);
    const hasKids = kids.length > 0;
    const expanded = hasKids && !state.collapsed.has(t.id);
    const closedAbove = ancestors(t).some((a) => a.done);
    const li = el('li', { class: 'node' + (t.done ? ' is-done' : '') + (closedAbove ? ' is-closed' : '') });
    const row = el('div', { class: 'row' });
    row.append(hasKids
      ? el('button', {
        type: 'button', class: 'twisty', id: `tw-${t.id}`, 'aria-expanded': String(expanded),
        'aria-label': `${expanded ? '접기' : '펼치기'}: ${t.title}`, onclick: () => toggleCollapse(t.id),
      }, el('span', { class: 'chev', 'aria-hidden': 'true' }))
      : el('span', { class: 'twisty-space', 'aria-hidden': 'true' }));
    row.append(checkEl(t, 'chk'));
    row.append(el('div', { class: 'row-main' }, el('p', { class: 'row-title', text: t.title }), treeMeta(t, depth, kids)));
    const menuOpen = isPanel('menu', t.id);
    row.append(el('button', {
      type: 'button', class: 'more', id: `more-${t.id}`, 'aria-expanded': String(menuOpen),
      'aria-label': `'${t.title}' 메뉴`, onclick: () => togglePanel('menu', t),
    }, el('span', { 'aria-hidden': 'true', text: '⋯' })));
    li.append(row);
    if (menuOpen) li.append(menuPanel(t, depth));
    if (isPanel('edit', t.id)) li.append(editPanel(t));
    const adding = isPanel('add', t.id);
    if (expanded || adding) {
      const branch = el('ul', { class: 'branch' });
      if (expanded) kids.forEach((c) => branch.append(nodeEl(c, depth + 1)));
      if (adding) branch.append(el('li', { class: 'node' }, addPanel(t)));
      else if (!t.done && !closedAbove && depth < MAX_DEPTH) {
        branch.append(el('li', { class: 'node' }, el('button', {
          type: 'button', class: 'ghost-add', id: `ga-${t.id}`, text: '+ 세부 할 일 추가', onclick: () => openAdd(t),
        })));
      }
      li.append(branch);
    }
    return li;
  }
  /* 완료·보관함 탭의 한 줄 */
  function flatRow(t, mode) {
    const crumb = crumbText(t);
    const inside = descendants(t).filter((d) => !d.archived || mode === 'archived').length;
    const meta = el('p', { class: 'row-meta' });
    if (mode === 'done') {
      const day = localDay(t.doneAt);
      meta.append(el('span', { class: 'date', text: day ? `${fmtDate(day)} 완료` : '완료' }));
      if (t.due) meta.append(el('span', { class: 'date', text: `시행일 ${fmtDate(t.due)}` }));
    } else {
      const day = localDay(t.archivedAt);
      meta.append(el('span', { class: 'date', text: day ? `${fmtDate(day)} 보관` : '보관함' }));
      if (t.done) meta.append(el('span', { class: 'pill', text: '끝낸 일' }));
    }
    if (inside) meta.append(el('span', { class: 'date', text: `세부 할 일 ${inside}개 포함` }));
    const li = el('li', { class: 'node' + (t.done && mode === 'done' ? ' is-done' : '') });
    const row = el('div', { class: 'row' });
    if (mode === 'done') row.append(checkEl(t, 'fchk'));
    row.append(el('div', { class: 'row-main' },
      crumb ? el('p', { class: 'crumb', text: `${crumb} ›` }) : null,
      el('p', { class: 'row-title', text: t.title }),
      meta));
    row.append(mode === 'done'
      ? el('button', { type: 'button', class: 'ghost small restore', id: `farch-${t.id}`, text: '보관', 'aria-label': `'${t.title}' 보관`, onclick: () => setArchived(t, true) })
      : el('button', { type: 'button', class: 'ghost small restore', id: `frest-${t.id}`, text: '되돌리기', 'aria-label': `'${t.title}' 되돌리기`, onclick: () => setArchived(t, false) }));
    li.append(row);
    return li;
  }
  function emptyBox(...kids) { return el('div', { class: 'empty' }, ...kids); }
  function renderList() {
    const doneList = state.tasks.filter((t) => t.done && !archivedPath(t))
      .sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt)));
    const archList = state.tasks.filter((t) => t.archived && !ancestors(t).some((a) => a.archived))
      .sort((a, b) => String(b.archivedAt).localeCompare(String(a.archivedAt)));
    const openRoots = IX.roots.filter((t) => !t.done && !t.archived).sort(byUrgency);
    $('#c-done').textContent = state.ready ? doneList.length : '';
    $('#c-archived').textContent = state.ready ? archList.length : '';
    document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === state.tab)));

    const parents = state.tasks.filter((t) => isOpen(t) && liveKids(t).length);
    const fold = $('#fold-all');
    fold.hidden = !state.ready || state.tab !== 'todo' || !parents.length;
    fold.textContent = parents.some((t) => !state.collapsed.has(t.id)) ? '모두 접기' : '모두 펼치기';

    const area = $('#tree-area');
    area.replaceChildren();
    if (!state.ready) { area.append(emptyBox(el('p', { text: '불러오는 중이에요…' }))); return; }
    if (state.tab === 'todo') {
      if (openRoots.length) { area.append(el('ul', { class: 'tree' }, ...openRoots.map((r) => nodeEl(r, 0)))); return; }
      if (!state.tasks.length) {
        area.append(emptyBox(
          el('p', { text: '아직 적어 둔 할 일이 없어요. 위에서 큰 테마나 할 일을 적고, 그 아래에 세부 할 일을 넣어 보세요.' }),
          el('button', { type: 'button', class: 'ghost', id: 'ex-btn', text: '예시 넣어 보기', onclick: addExamples }),
          el('p', { class: 'fine', text: '예시는 제목 앞에 (예시)가 붙어요. 다 본 뒤 보관하면 목록에서 사라져요.' })));
      } else {
        area.append(emptyBox(el('p', { text: '진행 중인 일이 없어요. 적어 둔 일을 다 끝냈어요!' })));
      }
      return;
    }
    const list = state.tab === 'done' ? doneList : archList;
    if (list.length) { area.append(el('ul', { class: 'tree flat' }, ...list.map((t) => flatRow(t, state.tab)))); return; }
    area.append(emptyBox(el('p', {
      text: state.tab === 'done'
        ? '아직 끝낸 일이 없어요. 하나 끝내면 여기에 모여요.'
        : "보관한 일이 없어요. 목록에서 숨기고 싶은 일은 ⋯ 메뉴의 '보관'을 누르세요. 기록은 지워지지 않아요.",
    })));
  }

  /* ---------- 알림 띠 ---------- */
  let toastTimer = null;
  function hideToast() { $('#toast').hidden = true; }
  function toast(msg, action, ms) {
    const box = $('#toast');
    box.replaceChildren(el('span', { text: msg }));
    if (action) box.append(el('button', { type: 'button', text: action.label, onclick: () => { hideToast(); action.run(); } }));
    box.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, ms || (action ? 6000 : 3500));
  }

  /* ---------- 위쪽 추가 폼 ---------- */
  function paintForm() {
    document.querySelectorAll('#due-chips [data-due]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.due === state.dueKind)));
    document.querySelectorAll('#pri-chips [data-pri]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.pri) === state.pri)));
    $('#date-chip').classList.toggle('is-on', state.dueKind === 'custom');
    $('#due-preview').textContent = state.due ? `시행일: ${fmtDate(state.due)} · ${whenLabel(daysUntil(state.due))}` : '시행일: 정하지 않음';
    const parent = state.parent ? IX.byId.get(state.parent) : null;
    $('#pri-chips').hidden = !!parent;
    $('#parent-hint').hidden = !parent;
    if (parent) $('#parent-hint').textContent = `세부 할 일은 '${short(rootOf(parent).title)}'의 중요도를 따라요.`;
    $('#add-btn').textContent = parent ? '세부 할 일 추가' : '추가하기';
  }
  function pickDue(kind) {
    const day = new Date().getDay();
    state.dueKind = kind;
    state.due = kind === 'today' ? todayISO()
      : kind === 'tomorrow' ? addDays(1)
      : kind === 'weekend' ? addDays(day === 0 ? 0 : 6 - day)
      : null;
    $('#due-date').value = state.due || '';
    paintForm();
  }
  $('#due-chips').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-due]');
    if (b) pickDue(b.dataset.due);
  });
  $('#due-date').addEventListener('change', (e) => {
    state.due = validISO(e.target.value);
    state.dueKind = state.due ? 'custom' : 'none';
    paintForm();
  });
  $('#pri-chips').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-pri]');
    if (!b) return;
    state.pri = Number(b.dataset.pri);
    paintForm();
  });
  $('#parent-select').addEventListener('change', (e) => {
    state.parent = e.target.value;
    paintForm();
  });
  $('#add-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = $('#title');
    const msg = $('#form-msg');
    const title = input.value.trim();
    if (!title) { msg.textContent = '할 일 내용을 적어 주세요.'; input.focus(); return; }
    if (!store) { msg.textContent = '아직 저장소를 불러오는 중이에요. 잠시 후 다시 눌러 주세요.'; return; }
    const parent = state.parent ? IX.byId.get(state.parent) : null;
    if (parent) { state.collapsed.delete(parent.id); saveCollapsed(); }
    const t = addTask({ title, due: state.due, priority: parent ? 2 : state.pri, parentId: parent ? parent.id : null });
    msg.textContent = parent
      ? `'${short(parent.title)}' 아래에 추가했어요. 이어서 더 적을 수 있어요.`
      : `추가했어요. (${whenLabel(daysUntil(t.due))}, 중요도 ${PRI[t.priority]})`;
    input.value = '';
    if (!parent) state.pri = 2;
    if (state.tab !== 'todo') { state.tab = 'todo'; try { localStorage.setItem(LS_TAB, 'todo'); } catch (_) {} }
    pickDue('none');
    requestRender();
    input.focus();
  });
  document.querySelector('.tabs').addEventListener('click', (e) => {
    const b = e.target.closest('.tab');
    if (!b) return;
    state.tab = b.dataset.tab;
    state.panel = null;
    try { localStorage.setItem(LS_TAB, state.tab); } catch (_) {}
    requestRender();
  });
  $('#fold-all').addEventListener('click', () => {
    const parents = state.tasks.filter((t) => isOpen(t) && liveKids(t).length);
    const anyOpen = parents.some((t) => !state.collapsed.has(t.id));
    parents.forEach((t) => (anyOpen ? state.collapsed.add(t.id) : state.collapsed.delete(t.id)));
    saveCollapsed();
    requestRender();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !state.panel) return;
    const id = state.panel.id;
    state.panel = null;
    requestRender();
    focusId(`more-${id}`);
  });
  document.addEventListener('compositionstart', () => { composing = true; }, true);
  document.addEventListener('compositionend', () => {
    composing = false;
    if (pendingRender) setTimeout(render, 0);
  }, true);

  /* 자정이 지나면 '며칠 남음'을 새로 계산 */
  setInterval(() => { if (iso(new Date()) !== state.day) requestRender(); }, 60000);

  try {
    const saved = localStorage.getItem(LS_TAB);
    if (saved === 'todo' || saved === 'done' || saved === 'archived') state.tab = saved;
  } catch (_) {}
  try {
    const c = JSON.parse(localStorage.getItem(LS_COLLAPSED) || '[]');
    if (Array.isArray(c)) c.forEach((id) => { if (typeof id === 'string') state.collapsed.add(id); });
  } catch (_) {}
  pickDue('none');
  render();
  connect();
})();
</script>
